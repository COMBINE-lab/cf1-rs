[package]
name = "cf1-rs"
version = "0.5.1"
edition = "2024"
rust-version = "1.91"
authors = ["Rob Patro <rob@cs.umd.edu>"]
description = "Fast construction of compacted reference de Bruijn graphs"
license = "BSD-3-Clause"
repository = "https://github.com/COMBINE-lab/cf1-rs"
homepage = "https://github.com/COMBINE-lab/cf1-rs"
keywords = ["bioinformatics", "de-bruijn-graph", "genomics", "k-mer"]
categories = ["command-line-utilities", "science"]
readme = "README.md"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
rayon = "1.12"
needletail = "0.7"
ph = { version = "0.11", default-features = false, features = ["wyhash"] }
simd-minimizers = "3.0"
voracious_radix_sort = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
nohash-hasher = "0.2"
anyhow = "1.0.104"
ahash = "0.8.12"
bon = "3.9.3"
itoa = "1.0.18"
libc = "0.2"
crossbeam-channel = "0.5.16"
